<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Tracker</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f8fa;
    color: #1c1e21;
  }
  .container { padding: 20px 24px 40px; max-width: 100%; }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .tabs { display: flex; gap: 6px; background: #eceef1; border-radius: 10px; padding: 4px; }
  .tab {
    border: none;
    background: transparent;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 550;
    color: #55585e;
    cursor: pointer;
  }
  .tab.active { background: #ffffff; color: #16181c; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .add-btn {
    background: #1c6e4a;
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-btn:hover { background: #17593c; }
  .reset-btn {
    background: transparent;
    color: #8a8f98;
    border: 1px solid #d9dce1;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    cursor: pointer;
    margin-left: 8px;
  }
  .reset-btn:hover { color: #c0392b; border-color: #c0392b; }
  .table-wrap {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e3e5e9;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #7a7f87;
    background: #fafbfc;
    padding: 10px 12px;
    border-bottom: 1px solid #e3e5e9;
    font-weight: 650;
    white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid #eef0f2; vertical-align: top; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr.terminal-row { background: #fafafa; }
  tbody tr.terminal-row [contenteditable], tbody tr.terminal-row input { color: #9a9ea5; }
  td { padding: 8px 10px; }
  col.title { width: 15%; }
  col.details { width: 19%; }
  col.due { width: 9%; }
  col.status { width: 11%; }
  col.deps { width: 12%; }
  col.resources { width: 12%; }
  col.notes { width: 16%; }
  col.actions { width: 3%; }
  col.todo-check { width: 4%; }
  col.todo-text { width: 71%; }
  col.todo-due { width: 12%; }
  col.todo-actions { width: 13%; }
  .todo-check-cell { text-align: center; }
  .todo-check-cell input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #1c6e4a; }
  .todo-actions-cell { white-space: nowrap; }
  .add-sub-btn {
    background: transparent;
    border: none;
    color: #8a8f98;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    padding: 4px 7px;
    border-radius: 5px;
    line-height: 1;
  }
  .add-sub-btn:hover { color: #1c6e4a; background: #e2f2e8; }
  .subtask-row td { padding: 5px 10px; }
  .subtask-text { padding-left: 40px; font-size: 12.5px; color: #55585e; }
  .subtask-toggle {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: #7a7f87;
    margin: 3px 0 0 2px;
    padding: 2px 5px;
    border-radius: 5px;
    cursor: pointer;
  }
  .subtask-toggle:hover { background: #f3f4f6; color: #1c1e21; }
  .subtask-chevron { font-size: 9px; display: inline-block; width: 9px; text-align: center; }
  .todo-sort-select {
    background: transparent;
    color: #55585e;
    border: 1px solid #d9dce1;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
    margin-right: 8px;
  }
  .todo-sort-select:hover { color: #1c6e4a; border-color: #1c6e4a; }
  [contenteditable] {
    min-height: 20px;
    outline: none;
    line-height: 1.4;
    padding: 3px 4px;
    border-radius: 5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  [contenteditable]:hover { background: #f3f4f6; }
  [contenteditable]:focus { background: #fff; box-shadow: 0 0 0 2px #cfe3d9 inset; }
  .title-cell { font-weight: 600; }
  [contenteditable]:empty:before {
    content: attr(data-placeholder);
    color: #b3b6bb;
    font-weight: 400;
  }
  input[type="date"] {
    border: none;
    background: transparent;
    font-size: 13px;
    padding: 3px 4px;
    border-radius: 5px;
    width: 100%;
    color: #1c1e21;
    font-family: inherit;
  }
  input[type="date"]:hover, input[type="date"]:focus { background: #f3f4f6; outline: none; }
  select.status-select {
    border: none;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
  }
  select.status-select:focus { outline: 2px solid #cfe3d9; }
  .st-not-started { background: #eef0f2; color: #55585e; }
  .st-planning { background: #eaf0fb; color: #2854a8; }
  .st-in-progress { background: #fff3d6; color: #92650c; }
  .st-on-hold { background: #fde8e0; color: #a44a1f; }
  .st-cancelled { background: #ececec; color: #8a8f98; }
  .st-completed { background: #e2f2e8; color: #1c6e4a; }
  .del-btn {
    background: transparent;
    border: none;
    color: #b3b6bb;
    cursor: pointer;
    font-size: 15px;
    padding: 4px 6px;
    border-radius: 5px;
    line-height: 1;
  }
  .del-btn:hover { color: #c0392b; background: #fdeeee; }
  .empty-state {
    text-align: center;
    color: #9a9ea5;
    padding: 40px 20px;
    font-size: 13.5px;
  }
  .count { font-size: 11px; color: #9a9ea5; margin-left: 4px; }
  .footer-note {
    margin-top: 10px;
    font-size: 11.5px;
    color: #9a9ea5;
  }

  /* Expandable long-text cells */
  .clamp-cell {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
    padding: 4px;
    border-radius: 5px;
    min-height: 2.6em;
    line-height: 1.3;
  }
  .clamp-cell:hover { background: #f3f4f6; }
  .clamp-cell:empty:before {
    content: attr(data-placeholder);
    color: #b3b6bb;
  }

  /* Side detail panel (Asana-style) */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 22, 26, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease;
    z-index: 40;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .side-panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: 460px;
    max-width: 92vw;
    background: #fff;
    box-shadow: -8px 0 28px rgba(0,0,0,0.14);
    transform: translateX(100%);
    transition: transform .18s ease;
    z-index: 50;
    display: flex;
    flex-direction: column;
    padding: 22px 24px 30px;
    overflow-y: auto;
  }
  .side-panel.open { transform: translateX(0); }
  .panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
  }
  .panel-title-input {
    flex: 1;
    font-size: 17px;
    font-weight: 650;
    border: none;
    outline: none;
    padding: 5px 6px;
    border-radius: 6px;
    font-family: inherit;
  }
  .panel-title-input:hover { background: #f3f4f6; }
  .panel-title-input:focus { background: #fff; box-shadow: 0 0 0 2px #cfe3d9; }
  .panel-close {
    border: none;
    background: transparent;
    font-size: 20px;
    line-height: 1;
    color: #9a9ea5;
    cursor: pointer;
    padding: 3px 9px;
    border-radius: 6px;
  }
  .panel-close:hover { background: #f3f4f6; color: #1c1e21; }
  .panel-meta {
    display: flex;
    gap: 18px;
    margin-bottom: 20px;
  }
  .panel-meta label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 11px;
    color: #7a7f87;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .panel-meta select, .panel-meta input[type="date"] {
    font-size: 13px;
    font-family: inherit;
    padding: 6px 8px;
    border-radius: 7px;
    border: 1px solid #e3e5e9;
    color: #1c1e21;
  }
  .panel-meta select.status-select { font-weight: 650; border: none; }
  .panel-field { margin-bottom: 18px; }
  .panel-field label {
    display: block;
    font-size: 11px;
    color: #7a7f87;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .panel-field textarea {
    width: 100%;
    border: 1px solid #e3e5e9;
    border-radius: 8px;
    padding: 10px;
    font-size: 13.5px;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
    color: #1c1e21;
  }
  .panel-field textarea:focus {
    outline: none;
    border-color: #1c6e4a;
    box-shadow: 0 0 0 2px #cfe3d9;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Project Tracker</h1>
  </div>
  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab" data-view="all">All Projects</button>
      <button class="tab" data-view="active">Active Projects</button>
      <button class="tab" data-view="archived">Cancelled &amp; Completed</button>
      <button class="tab" data-view="todos">To-Dos</button>
    </div>
    <div>
      <select id="todoSortSelect" class="todo-sort-select" style="display:none;">
        <option value="manual">Sort: Manual</option>
        <option value="due">Sort: Due date</option>
      </select>
      <button class="add-btn" id="addBtn">+ Add project</button>
      <button class="reset-btn" id="resetBtn" title="Clear all rows">Clear all</button>
    </div>
  </div>
  <div class="table-wrap" id="tableWrap">
    <table>
      <colgroup>
        <col class="title"><col class="details"><col class="due"><col class="status">
        <col class="deps"><col class="resources"><col class="notes"><col class="actions">
      </colgroup>
      <thead>
        <tr>
          <th>Title</th><th>Details</th><th>Due by</th><th>Status</th>
          <th>Dependencies</th><th>Resources</th><th>Running notes</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;"></div>
  </div>
  <div class="table-wrap" id="todoWrap" style="display:none;">
    <table>
      <colgroup>
        <col class="todo-check"><col class="todo-text"><col class="todo-due"><col class="todo-actions">
      </colgroup>
      <thead>
        <tr>
          <th></th><th>To-do</th><th>Due by</th><th></th>
        </tr>
      </thead>
      <tbody id="todoTbody"></tbody>
    </table>
    <div class="empty-state" id="todoEmptyState" style="display:none;"></div>
  </div>
  <div class="footer-note" id="footerNote">Edits save automatically to this device. Completed and cancelled projects always sink to the bottom in the "All Projects" view. Click into Details or Running notes to open the full record.</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="side-panel" id="panel">
  <div class="panel-header">
    <input id="panelTitle" class="panel-title-input" placeholder="Project title">
    <button class="panel-close" id="panelClose" title="Close">&times;</button>
  </div>
  <div class="panel-meta">
    <label>Status
      <select id="panelStatus" class="status-select"></select>
    </label>
    <label>Due by
      <input type="date" id="panelDue">
    </label>
  </div>
  <div class="panel-field">
    <label>Details</label>
    <textarea id="panelDetails" rows="6" placeholder="What is this project?"></textarea>
  </div>
  <div class="panel-field">
    <label>Dependencies</label>
    <textarea id="panelDeps" rows="2" placeholder="Blocked by / blocking"></textarea>
  </div>
  <div class="panel-field">
    <label>Resources</label>
    <textarea id="panelResources" rows="2" placeholder="Links, docs, owners"></textarea>
  </div>
  <div class="panel-field">
    <label>Running notes</label>
    <textarea id="panelNotes" rows="9" placeholder="Latest update"></textarea>
  </div>
</div>

<script>
  const STATUS_OPTIONS = ["Not Started", "Planning", "In Progress", "On Hold", "Cancelled", "Completed"];
  const TERMINAL = ["Cancelled", "Completed"];
  const ACTIVE_STATUSES = ["Planning", "In Progress"];
  const STATUS_CLASS = {
    "Not Started": "st-not-started",
    "Planning": "st-planning",
    "In Progress": "st-in-progress",
    "On Hold": "st-on-hold",
    "Cancelled": "st-cancelled",
    "Completed": "st-completed"
  };
  const STORAGE_KEY = "jsq_project_tracker_v1";
  const VIEW_KEY = "jsq_project_tracker_view_v1";
  const TODO_STORAGE_KEY = "jsq_project_tracker_todos_v1";
  const TODO_SORT_KEY = "jsq_project_tracker_todo_sort_v1";

  function uid() { return "p_" + Math.random().toString(36).slice(2, 10); }

  function seedData() {
    return [
      { id: uid(), title: "Zendesk macro cleanup", details: "Audit and consolidate duplicate macros across support queues.", dueBy: "2026-09-12", status: "In Progress", dependencies: "", resources: "Zendesk admin access", notes: "Kickoff done 8/20. Inventory in progress." },
      { id: uid(), title: "New hire onboarding revamp", details: "Rebuild the first-30-days plan for new CSS hires.", dueBy: "2026-09-30", status: "Planning", dependencies: "People team sign-off", resources: "Onboarding doc, Lattice", notes: "" },
      { id: uid(), title: "Q3 QA scorecard review", details: "Review QA scoring rubric with the team leads.", dueBy: "2026-09-05", status: "Not Started", dependencies: "Q2 QA results", resources: "", notes: "" },
      { id: uid(), title: "CSAT survey redesign", details: "Shorten post-ticket survey, add one open text field.", dueBy: "2026-08-01", status: "Completed", dependencies: "", resources: "", notes: "Shipped 7/28, CSAT response rate up 6%." },
      { id: uid(), title: "Live chat pilot", details: "Pilot live chat for enterprise tier.", dueBy: "2026-07-15", status: "Cancelled", dependencies: "", resources: "", notes: "Deprioritized in favor of Zendesk cleanup." }
    ];
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error(e); }
    return seedData();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadTodos() {
    try {
      const raw = localStorage.getItem(TODO_STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error(e); }
    return [];
  }

  function saveTodos() {
    localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(todos));
  }

  let data = load();
  let todos = loadTodos();
  let todoSort = localStorage.getItem(TODO_SORT_KEY) || "manual";
  let expandedTodoIds = new Set();
  let currentView = localStorage.getItem(VIEW_KEY) || "all";
  let currentPanelId = null;

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  function getRows() {
    if (currentView === "active") {
      return data.filter(r => ACTIVE_STATUSES.includes(r.status));
    }
    if (currentView === "archived") {
      return data.filter(r => TERMINAL.includes(r.status));
    }
    return data.slice().map((r, i) => ({ r, i })).sort((a, b) => {
      const at = TERMINAL.includes(a.r.status) ? 1 : 0;
      const bt = TERMINAL.includes(b.r.status) ? 1 : 0;
      if (at !== bt) return at - bt;
      return a.i - b.i;
    }).map(x => x.r);
  }

  function updateTabCounts() {
    document.querySelector('[data-view="all"]').innerHTML =
      `All Projects <span class="count">${data.length}</span>`;
    document.querySelector('[data-view="active"]').innerHTML =
      `Active Projects <span class="count">${data.filter(r => ACTIVE_STATUSES.includes(r.status)).length}</span>`;
    document.querySelector('[data-view="archived"]').innerHTML =
      `Cancelled &amp; Completed <span class="count">${data.filter(r => TERMINAL.includes(r.status)).length}</span>`;
    document.querySelector('[data-view="todos"]').innerHTML =
      `To-Dos <span class="count">${todos.filter(t => !t.done).length}</span>`;
  }

  function render() {
    document.querySelectorAll(".tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === currentView);
    });
    updateTabCounts();

    const isTodos = currentView === "todos";
    document.getElementById("tableWrap").style.display = isTodos ? "none" : "";
    document.getElementById("todoWrap").style.display = isTodos ? "" : "none";
    document.getElementById("todoSortSelect").style.display = isTodos ? "" : "none";
    document.getElementById("todoSortSelect").value = todoSort;
    document.getElementById("addBtn").textContent = isTodos ? "+ Add to-do" : "+ Add project";
    document.getElementById("footerNote").textContent = isTodos
      ? "Checked items sink to the bottom. Edits save automatically to this device."
      : "Edits save automatically to this device. Completed and cancelled projects always sink to the bottom in the \"All Projects\" view. Click into Details or Running notes to open the full record.";

    if (isTodos) {
      renderTodos();
    } else {
      renderProjects();
    }
  }

  function renderProjects() {
    const rows = getRows();
    const tbody = document.getElementById("tbody");
    const emptyState = document.getElementById("emptyState");
    tbody.innerHTML = "";

    if (rows.length === 0) {
      emptyState.style.display = "block";
      emptyState.textContent = currentView === "archived"
        ? "No cancelled or completed projects yet."
        : currentView === "active"
        ? "No active projects. Add one above."
        : "No projects yet. Click \"+ Add project\" to start.";
      return;
    }
    emptyState.style.display = "none";

    rows.forEach(row => {
      const tr = document.createElement("tr");
      tr.dataset.id = row.id;
      if (TERMINAL.includes(row.status)) tr.classList.add("terminal-row");

      const statusOptionsHtml = STATUS_OPTIONS.map(s =>
        `<option value="${s}" ${s === row.status ? "selected" : ""}>${s}</option>`
      ).join("");

      tr.innerHTML = `
        <td><div class="title-cell" contenteditable="true" data-field="title" data-placeholder="Project title">${esc(row.title)}</div></td>
        <td><div class="clamp-cell" data-field="details" data-placeholder="What is this project? Click to expand." title="Click to expand">${esc(row.details)}</div></td>
        <td><input type="date" data-field="dueBy" value="${row.dueBy || ""}"></td>
        <td><select class="status-select ${STATUS_CLASS[row.status] || ""}" data-field="status">${statusOptionsHtml}</select></td>
        <td><div contenteditable="true" data-field="dependencies" data-placeholder="Blocked by / blocking">${esc(row.dependencies)}</div></td>
        <td><div contenteditable="true" data-field="resources" data-placeholder="Links, docs, owners">${esc(row.resources)}</div></td>
        <td><div class="clamp-cell" data-field="notes" data-placeholder="Latest update. Click to expand." title="Click to expand">${esc(row.notes)}</div></td>
        <td><button class="del-btn" title="Delete project">&#10005;</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function getTodoRows() {
    return todos.slice().map((r, i) => ({ r, i })).sort((a, b) => {
      const ad = a.r.done ? 1 : 0;
      const bd = b.r.done ? 1 : 0;
      if (ad !== bd) return ad - bd;
      if (todoSort === "due") {
        const aDate = a.r.dueBy || "9999-12-31";
        const bDate = b.r.dueBy || "9999-12-31";
        if (aDate !== bDate) return aDate < bDate ? -1 : 1;
      }
      return a.i - b.i;
    }).map(x => x.r);
  }

  function getSubtaskRows(todo) {
    const subs = todo.subtasks || [];
    return subs.slice().map((r, i) => ({ r, i })).sort((a, b) => {
      const ad = a.r.done ? 1 : 0;
      const bd = b.r.done ? 1 : 0;
      if (ad !== bd) return ad - bd;
      return a.i - b.i;
    }).map(x => x.r);
  }

  function findTodo(id) { return todos.find(t => t.id === id); }

  function findSubtask(parentId, subId) {
    const parent = findTodo(parentId);
    if (!parent) return null;
    return (parent.subtasks || []).find(s => s.id === subId);
  }

  function renderTodos() {
    const rows = getTodoRows();
    const tbody = document.getElementById("todoTbody");
    const emptyState = document.getElementById("todoEmptyState");
    tbody.innerHTML = "";

    if (rows.length === 0) {
      emptyState.style.display = "block";
      emptyState.textContent = "No to-dos yet. Click \"+ Add to-do\" to start.";
      return;
    }
    emptyState.style.display = "none";

    rows.forEach(row => {
      const tr = document.createElement("tr");
      tr.dataset.id = row.id;
      if (row.done) tr.classList.add("terminal-row");

      const subs = row.subtasks || [];
      const doneCount = subs.filter(s => s.done).length;
      const isOpen = expandedTodoIds.has(row.id);
      const subCountHtml = subs.length
        ? `<div class="subtask-toggle" title="${isOpen ? "Hide" : "Show"} subtasks">
             <span class="subtask-chevron">${isOpen ? "\u25be" : "\u25b8"}</span> ${doneCount}/${subs.length} done
           </div>`
        : "";

      tr.innerHTML = `
        <td class="todo-check-cell"><input type="checkbox" data-field="done" ${row.done ? "checked" : ""}></td>
        <td>
          <div class="title-cell" contenteditable="true" data-field="text" data-placeholder="To-do">${esc(row.text)}</div>
          ${subCountHtml}
        </td>
        <td><input type="date" data-field="dueBy" value="${row.dueBy || ""}"></td>
        <td class="todo-actions-cell">
          <button class="add-sub-btn" title="Add subtask">+</button>
          <button class="del-btn" title="Delete to-do">&#10005;</button>
        </td>
      `;
      tbody.appendChild(tr);

      if (isOpen) {
        getSubtaskRows(row).forEach(sub => {
          const subTr = document.createElement("tr");
          subTr.classList.add("subtask-row");
          if (sub.done) subTr.classList.add("terminal-row");
          subTr.dataset.parentId = row.id;
          subTr.dataset.id = sub.id;
          subTr.innerHTML = `
            <td class="todo-check-cell"><input type="checkbox" data-field="done" ${sub.done ? "checked" : ""}></td>
            <td colspan="2"><div class="subtask-text" contenteditable="true" data-field="text" data-placeholder="Subtask">${esc(sub.text)}</div></td>
            <td><button class="del-btn" title="Delete subtask">&#10005;</button></td>
          `;
          tbody.appendChild(subTr);
        });
      }
    });
  }

  function findRow(id) { return data.find(r => r.id === id); }

  document.getElementById("tbody").addEventListener("input", (e) => {
    const field = e.target.dataset.field;
    if (!field || !e.target.isContentEditable) return;
    const tr = e.target.closest("tr");
    const row = findRow(tr.dataset.id);
    if (!row) return;
    row[field] = e.target.innerText;
    save();
  });

  document.getElementById("tbody").addEventListener("change", (e) => {
    if (e.target.dataset.field === "status") {
      const tr = e.target.closest("tr");
      const row = findRow(tr.dataset.id);
      if (!row) return;
      row.status = e.target.value;
      save();
      render();
    } else if (e.target.dataset.field === "dueBy") {
      const tr = e.target.closest("tr");
      const row = findRow(tr.dataset.id);
      if (!row) return;
      row.dueBy = e.target.value;
      save();
    }
  });

  document.getElementById("tbody").addEventListener("click", (e) => {
    if (e.target.classList.contains("del-btn")) {
      const tr = e.target.closest("tr");
      const row = findRow(tr.dataset.id);
      if (!row) return;
      if (confirm(`Delete "${row.title || "this project"}"?`)) {
        data = data.filter(r => r.id !== row.id);
        save();
        render();
      }
      return;
    }
    const clampCell = e.target.closest(".clamp-cell");
    if (clampCell) {
      const tr = clampCell.closest("tr");
      openPanel(tr.dataset.id, clampCell.dataset.field);
    }
  });

  document.getElementById("todoTbody").addEventListener("input", (e) => {
    const field = e.target.dataset.field;
    if (!field || !e.target.isContentEditable) return;
    const tr = e.target.closest("tr");
    if (tr.classList.contains("subtask-row")) {
      const sub = findSubtask(tr.dataset.parentId, tr.dataset.id);
      if (!sub) return;
      sub[field] = e.target.innerText;
      saveTodos();
      return;
    }
    const row = findTodo(tr.dataset.id);
    if (!row) return;
    row[field] = e.target.innerText;
    saveTodos();
  });

  document.getElementById("todoTbody").addEventListener("change", (e) => {
    const tr = e.target.closest("tr");
    if (!tr) return;
    if (tr.classList.contains("subtask-row")) {
      if (e.target.dataset.field === "done") {
        const sub = findSubtask(tr.dataset.parentId, tr.dataset.id);
        if (!sub) return;
        sub.done = e.target.checked;
        saveTodos();
        renderTodos();
      }
      return;
    }
    const row = findTodo(tr.dataset.id);
    if (!row) return;
    if (e.target.dataset.field === "done") {
      row.done = e.target.checked;
      saveTodos();
      renderTodos();
      updateTabCounts();
    } else if (e.target.dataset.field === "dueBy") {
      row.dueBy = e.target.value;
      saveTodos();
      if (todoSort === "due") renderTodos();
    }
  });

  document.getElementById("todoTbody").addEventListener("click", (e) => {
    const tr = e.target.closest("tr");
    if (!tr) return;

    if (e.target.closest(".subtask-toggle")) {
      if (expandedTodoIds.has(tr.dataset.id)) {
        expandedTodoIds.delete(tr.dataset.id);
      } else {
        expandedTodoIds.add(tr.dataset.id);
      }
      renderTodos();
      return;
    }

    if (e.target.classList.contains("add-sub-btn")) {
      const row = findTodo(tr.dataset.id);
      if (!row) return;
      if (!row.subtasks) row.subtasks = [];
      const newSub = { id: uid(), text: "", done: false };
      row.subtasks.push(newSub);
      expandedTodoIds.add(row.id);
      saveTodos();
      renderTodos();
      const newRow = document.querySelector(`tr.subtask-row[data-id="${newSub.id}"]`);
      if (newRow) {
        const textCell = newRow.querySelector('[data-field="text"]');
        if (textCell) textCell.focus();
      }
      return;
    }

    if (e.target.classList.contains("del-btn")) {
      if (tr.classList.contains("subtask-row")) {
        const parent = findTodo(tr.dataset.parentId);
        if (!parent) return;
        parent.subtasks = (parent.subtasks || []).filter(s => s.id !== tr.dataset.id);
        saveTodos();
        renderTodos();
        return;
      }
      const row = findTodo(tr.dataset.id);
      if (!row) return;
      if (confirm(`Delete "${row.text || "this to-do"}"?`)) {
        todos = todos.filter(t => t.id !== row.id);
        saveTodos();
        renderTodos();
        updateTabCounts();
      }
      return;
    }
  });

  document.getElementById("todoSortSelect").addEventListener("change", (e) => {
    todoSort = e.target.value;
    localStorage.setItem(TODO_SORT_KEY, todoSort);
    renderTodos();
  });

  document.getElementById("addBtn").addEventListener("click", () => {
    if (currentView === "todos") {
      todos.push({ id: uid(), text: "", dueBy: "", done: false, subtasks: [] });
      saveTodos();
      render();
      const lastRow = document.getElementById("todoTbody").lastElementChild;
      if (lastRow) {
        const textCell = lastRow.querySelector('[data-field="text"]');
        if (textCell) textCell.focus();
      }
      return;
    }
    data.push({ id: uid(), title: "", details: "", dueBy: "", status: "Not Started", dependencies: "", resources: "", notes: "" });
    save();
    if (currentView === "archived") { currentView = "all"; localStorage.setItem(VIEW_KEY, currentView); }
    render();
    const lastRow = document.getElementById("tbody").lastElementChild;
    if (lastRow) {
      const titleCell = lastRow.querySelector('[data-field="title"]');
      if (titleCell) titleCell.focus();
    }
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (currentView === "todos") {
      if (confirm("Clear all to-dos from this tracker? This can't be undone.")) {
        todos = [];
        saveTodos();
        render();
      }
      return;
    }
    if (confirm("Clear all projects from this tracker? This can't be undone.")) {
      data = [];
      save();
      render();
    }
  });

  document.getElementById("tabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    currentView = btn.dataset.view;
    localStorage.setItem(VIEW_KEY, currentView);
    render();
  });

  // ---- Side detail panel ----
  const panelEl = document.getElementById("panel");
  const overlayEl = document.getElementById("overlay");
  const panelTitle = document.getElementById("panelTitle");
  const panelStatus = document.getElementById("panelStatus");
  const panelDue = document.getElementById("panelDue");
  const panelDetails = document.getElementById("panelDetails");
  const panelDeps = document.getElementById("panelDeps");
  const panelResources = document.getElementById("panelResources");
  const panelNotes = document.getElementById("panelNotes");

  panelStatus.innerHTML = STATUS_OPTIONS.map(s => `<option value="${s}">${s}</option>`).join("");

  function openPanel(id, focusField) {
    const row = findRow(id);
    if (!row) return;
    currentPanelId = id;
    panelTitle.value = row.title || "";
    panelStatus.value = row.status;
    panelStatus.className = "status-select " + (STATUS_CLASS[row.status] || "");
    panelDue.value = row.dueBy || "";
    panelDetails.value = row.details || "";
    panelDeps.value = row.dependencies || "";
    panelResources.value = row.resources || "";
    panelNotes.value = row.notes || "";

    panelEl.classList.add("open");
    overlayEl.classList.add("open");

    const focusMap = { details: panelDetails, notes: panelNotes, title: panelTitle };
    const target = focusMap[focusField] || panelDetails;
    setTimeout(() => {
      target.focus();
      if (target.setSelectionRange) target.setSelectionRange(target.value.length, target.value.length);
    }, 180);
  }

  function closePanel() {
    panelEl.classList.remove("open");
    overlayEl.classList.remove("open");
    currentPanelId = null;
    render();
  }

  function panelField(field, value) {
    if (!currentPanelId) return;
    const row = findRow(currentPanelId);
    if (!row) return;
    row[field] = value;
    save();
  }

  panelTitle.addEventListener("input", () => panelField("title", panelTitle.value));
  panelStatus.addEventListener("change", () => {
    panelField("status", panelStatus.value);
    panelStatus.className = "status-select " + (STATUS_CLASS[panelStatus.value] || "");
  });
  panelDue.addEventListener("change", () => panelField("dueBy", panelDue.value));
  panelDetails.addEventListener("input", () => panelField("details", panelDetails.value));
  panelDeps.addEventListener("input", () => panelField("dependencies", panelDeps.value));
  panelResources.addEventListener("input", () => panelField("resources", panelResources.value));
  panelNotes.addEventListener("input", () => panelField("notes", panelNotes.value));

  document.getElementById("panelClose").addEventListener("click", closePanel);
  overlayEl.addEventListener("click", closePanel);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && currentPanelId) closePanel();
  });

  render();
</script>
</body>
</html>
